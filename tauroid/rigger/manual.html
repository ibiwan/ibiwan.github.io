# tauroid rigger

A browser tool for building 2D skeletons, pinning paper-doll artwork to them, and animating
the result. It exports a clean zipped-text bundle, loadable by this tool and by the Tauroid engine.

---

## Access

### Hosted

https://ibiwan.github.io/tauroid/rigger/index.html

### Source and Self-Host (easy)

https://github.com/ibiwan/tauroid/tree/master/tools/rigger

---

## Core Concepts

### Anchors

An **`anchor`** is a point in space that things can be attached to. 

* There are currently four types of anchors: `world`, `root`, `tip`, `art`.

* The **`world`** frame origin is the anchor that is available first and always.

### Bones

A **`bone`** is the core entity of all rigging skeletons and animation.

* A bone consists of an anchor reference, an angle (degrees), and a length.

* A bone inherits the angle from its anchor, then rest and pose angles are added to that.
    * If a bone is part of a solved system, the solution's angle will override the above sum.

* A bone inherits its **`root`** position from its anchor, offset by x/y values in the parent anchor's coordinate system.
    * Anchor another bone from a root to form a branch.

* Length can be 0, allowing a bone to act as a simple reference frame definition.
    * Use for grips, sockets, mounts, or solution targets (IK, Aim).

* A bone's **`tip`** anchor is computed from the root, angle, and length.
    * Anchor another bone from a tip to form a chain.

### Art

This tool currently natively speaks only SVG.  An art file can be added by dragging onto the window or by clicking *`+`* next to "Art in Scene".

* Any file added twice will be handled as independent instances and can be placed and attached independently.

* The ordering in the "Art in Scene" list is the z-ordering for render; move a graphic up or down in the list to reorder occlusion.

* An **`art`** anchor is a named point added to a graphic for use in attaching and targeting.
    * Click *`+ anchor`* while a graphic is selected to add a green anchor dot at the graphic's origin.  
    You can drag it to any point on the graphic, and name it in the Inspector view (right pane).
    You can add any number of anchors to a graphic; usual would be one for a root point and one to define a direction.


---

## The Four Modes

Cycle with *`\``*.

| mode | shows | edits affect |
|---|---|---|
| **rest** | the default skeletal arrangement created with bone bindings | bone bindings |
| **solve** | bind pose **+ constraints (aim, reach, match)** | bone bindings |
| **pose** | custom pose within constraints | pose deltas |
| **anim** | animation: generated poses within constraints | keyframe poses |

### Rest

The dim skeleton behind the bright one is always the **rest position**, so in
any mode you can see how far things have moved from it.

### Solve

**solve** is the one to build a rig in. You edit rest exactly as in rest mode —
drag joints, set lengths — but constraints re-solve live as you drag, so you can
see whether the solver actually works while you are still setting it up.

### Pose, Anim

In **pose** and **anim**, dragging rotates only. A pose is a rotation delta;
stretching a bone at pose time would bake a length change into an animation.

---

## Building a Skeleton

1. *`+ root`* adds a bone at the world origin.
2. Select it, then use *`+ sibling`*, *`+ at tip`*, or *`+ at root`* in the inspector to grow the tree
   - *at tip* — the child is offset by this bone's extent and inherits its angle.
   - *at root* — the child inherits this bone's position and angle.
   - *sibling* — the child inherits the parent's position and angle.
3. Drag the **filled circle** (a bone's root) to move it (and change the bone's offset x/y values)
4. Drag the **hollow orange circle** (its tip) to set angle and length at once.
  - A zero-length bone has no tip to grab, so it gets a **shaded circle** you drag to rotate.
  - Hold *`shift`* while aiming to snap to 45° in world space.
5. Double-click a name in the hierarchy to rename it in the inspector.
6. A bone's reference anchor can be changed using the drop-down in the inspector.

Bones have a wide hit line, so you can click anywhere along the line to select them.
When multiple anchors overlap, selecting a bone lets you drag that bone's endpoints.

---

### Locks

In the Inspector, each of *offset x*, *offset y*, *rest angle* and *length* has a padlock. A locked field cannot be changed by hand — the inspector input is disabled and dragging skips it. Locks are **per-axis**: lock x and the root still slides freely in y.

Locks guard manual edits only. **The IK solver and posing are unaffected**, because neither writes to these fields — constraints are evaluated rather than stored, and posing writes `poseAngle`.

Use them for bind-pose data you are done with and do not want to nudge by accident, or to constrain edits to only one or another field.

---

## Attaching Art to the Skeleton

1. Add art to scene (drag file to UI or select with *`+`*)
2. Add anchors to the graphic - an "origin" anchor and "direction" anchor is usually a good start.
    1. Select graphic in "Art in Scene" pane
    2. Select *`+ anchor`* in the Inspector
    3. Name the anchor in the Inspector
    4. Drag the anchor on the graphic to its location
      1. All anchors in an unattached graphic will have direction defined relative to world.
3. Attach the graphic to an anchor in the scene
    1. Select target anchor (usually a bone root) from "attached to" drop-down in Inspector.
      1. All anchors in an attached graphic will have direction defined relative to the target anchor.
    2. Select an art anchor in the "origin" drop-down to position the graphic relative to the target anchor
    3. Select an art anchor in the "direction" drop-down to orient the graphic relative to the target anchor
    4. Optionally adjust the "scale" slider to resize the graphic; its origin and direction will stay consistent.

Anchors are **just named point/direction tuples**. They have no roles baked in. The same anchor
can act as an origin on one binding, a grip on another, a direction on another. The direction can be explicit (bone anchors), implicit (world or art anchors), or solved from constraints.

You can click `*download .svg`* to retrieve a copy of the graphic with the anchors baked in for future use.

---

### For whoever is drawing the art

A couple things that cause real problems, worth putting in a brief:

- **Presentation attributes, not internal CSS.** Illustrator's `.st0`-style
  class names are document-scoped. The tool namespaces them, but plain
  attributes are simpler and more predictable.
- **Responsive OFF.** The tool needs an explicit `viewBox` with width and height
  to place the art.

---

## Constraints

Select a bone and pick a *`solve`* kind from the drop-down in the inspector.

Options are `pose`, `aim`, `reach`, `match`

No numeric inverse-kinematics solves are currently supported.

### pose

Bone's angle is set by parent/rest/pose angles, summed. Not dynamic.

### aim

Bone's angle is set by a target anchor, such that the bone points at the target.

### reach

Controls *two* angles, that of the current bone and its parent. 
Closed-form Inverse Kinematics is used to attempt to put this bone's tip on the target anchor.

* Solve is accomplished using Law of cosines
* The *`bend`* button controls which solution is selected, e.g. which way an elbow should bend.
* Falls back to `aim` mode if either bone's length is zero.

### match

Copies values from the target anchor.
* Each of x, y, angle is available to be matched, selectable independently.
* Offsets can be applied to each matched value, set independently.
* X and Y can be measured in the world's frame (horizontal, vertical), or in the target anchor's frame (forward, lateral).

---

### Notes

* Targets can be any bone root, bone tip, or art anchor. 
* Any descendant of the constrained bone cannot be a target. 
  * Any invalid constraints encountered will not be computed and will raise a warning.
  * Constraints themselves do not count as ancestry linkages for the purposes of this rule.
* Constraints are evaluated, and emitted as part of yaml output, but are not stored in the skeleton definition.
* Mutually-dependent constraints attempt to solve iteratively, and stop at an undefined balance point if (constraint count + 1) tries are exhausted before settling.

---

## Animation

Switch to **anim**. The art list is replaced by the animation list, and a lane
pane opens at the bottom.

### Model

Every keyframe stores **deltas from rest** — angle plus x/y offset, per bone. One
keyframe can pose any number of bones. Where two animations touch the same bone
at the same instant, their deltas simply **add**, in either order.

Animations are independent oscillators. Each runs on its own period. A 5-frame
and a 7-frame loop line up again every 35 frames without anyone authoring 35
frames of anything.

### Types

| type | start pose | end pose | behaviour |
|---|---|---|---|
| **forward loop** | required | *not* required | wraps from the last key back to frame 0 |
| **back & forth** | required | required | reverses at the last frame |
| **one-shot** | required | required | plays once, then holds |

A forward loop needs no end pose because its start pose *is* its end pose.

### Working with animations

1. Click *`+`* next to *animations* creates a new animation. Set its type and length in the Inspector.
2. Tick its checkbox to put it in the lane view and include it in preview.
3. With an animation selected, click anywhere on its track to add a keyframe at that point; click a dot to select it.
4. With a keyframe selected, the inspector lists every bone. *`+`* adds a delta for that bone; *`×`* removes it.
5. Orange dots are the mandatory start/end poses and cannot be deleted. Change the type or length instead.

### Rotation direction

Angles are directions, not magnitudes. Interpolating them numerically would make
270° → 0° count *down* through 135, unwinding a turn instead of finishing it.

So each keyframe carries a **turn** for its outgoing segment:

- **short way round** (default) — correct almost always, and closes a loop
  properly.
- **increasing (cw)** / **decreasing (ccw)** — forces a direction.

On a forward loop's last key this is labelled *rotate to start*, because that
segment is the wrap — the one segment the stored values cannot describe, since
both its ends are fixed.

A forced direction between two *equal* angles is a **full revolution**. That is
how you author a continuous spin: one key, direction forced, no second key.

### Playback

**▶** or **space**. The fps box sets the rate.

The playhead is a clock, not a loop — it counts up, and each lane wraps on its
own period. There is no shared wrap point, so the composite stays continuous
however the periods relate.

The lane pane shows a **window** onto that clock, sized to the longest lane
(loops counted twice, so you can watch one come round and check the seam).
Scrubbing lands anywhere inside it. The playhead line sweeping back to the left
edge is cosmetic — the pose comes from absolute time, so nothing jumps.

Grabbing the ruler or pressing an arrow key takes playback off autopilot.

If nothing active loops — only one-shots — playback runs to the end and stops
rather than restarting.

---

## Controls

### Mouse

| | |
|---|---|
| drag empty space, or middle-drag | pan |
| wheel | zoom (toward the cursor) |
| drag filled circle | move a bone's root |
| drag hollow circle | aim + set length |
| drag tick | rotate a zero-length bone |
| shift while aiming | snap to 45° |
| drag on the ruler | scrub |
| double-click a name | rename |

### Keyboard

| | |
|---|---|
| `` ` `` | cycle rest → solve → pose → anim |
| `[` `]` | nudge angle 1° (shift: 10°) |
| `space` | play/pause *(anim mode)* |
| `←` `→` | step the playhead 1 frame (shift: 5) *(anim mode)* |
| `delete` | remove the selection |
| `cmd/ctrl+Z` | undo — `shift` to redo |

Delete removes a bone **and its descendants**. Art bound to a deleted bone falls
back to world rather than vanishing.

---

## Export and import

**export** produces `rig.zip`:

| file | what it is |
|---|---|
| `skeleton.yaml` | engine-facing. Resolved rest pose, world positions, degrees. Constraints, and animated Baked positions. |
| `rig.json` | the authoring graph — refs, anchors, inline markup. |
| `art/*.svg` | every art item with its anchors written in. |

**open…** reads a `rig.zip` or a bare `rig.json`. Dropping either onto the
window replaces the current rig, after asking.

Two things worth knowing:

- Import reads **only `rig.json`**, because it carries every art item's markup
  inline. The `art/*.svg` files are outputs for the engine, not inputs. A
  hand-edited SVG inside a bundle is ignored on re-import — drop the edited file
  in as art instead.
- `skeleton.yaml` is resolved and cannot be loaded back. It is a build product.

The exported bind pose is **unsolved**. Constraints are an authoring aid; baking
their output into the rest skeleton would make it un-editable downstream.

Old bundles open. Anything from schema v3 onward migrates forward on load;
anything older is refused with a reason rather than half-loaded.

  <script>
    const source = document.querySelector("#markdown").textContent;
    const output = document.querySelector("#output");
    const tocElement = document.querySelector("#toc");

    const toc = [];
    const slugCounts = new Map();

    output.innerHTML = markdown(source);
    tocElement.innerHTML = renderToc(toc);

    document.querySelectorAll("[data-set-theme]").forEach(button => {
      button.addEventListener("click", () => {
        const theme = button.dataset.setTheme;

        if (theme) {
          document.documentElement.dataset.theme = theme;
        } else {
          delete document.documentElement.dataset.theme;
        }
      });
    });


    function markdown(source) {
      const lines = source
        .replace(/\r\n?/g, "\n")
        .trim()
        .split("\n");

      let html = "";
      let paragraph = [];
      let list = [];
      let quote = [];
      let fence = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;

        html += `<p>${inline(paragraph.join("\n"))}</p>`;
        paragraph = [];
      };

      const flushList = () => {
        if (!list.length) return;

        const roots = [];
        const stack = [{ depth: -1, children: roots }];

        for (const item of list) {
          while (stack.at(-1).depth >= item.depth) {
            stack.pop();
          }

          const node = { ...item, children: [] };
          stack.at(-1).children.push(node);
          stack.push(node);
        }

        const renderListItems = items => {
          let rendered = "";

          for (let i = 0; i < items.length;) {
            const type = items[i].type;
            const group = [];

            while (i < items.length && items[i].type === type) {
              group.push(items[i]);
              i++;
            }

            rendered += `<${type}>`;

            for (const item of group) {
              rendered +=
                `<li>${inline(item.text)}` +
                renderListItems(item.children) +
                `</li>`;
            }

            rendered += `</${type}>`;
          }

          return rendered;
        };

        html += renderListItems(roots);
        list = [];
      };

      const flushQuote = () => {
        if (!quote.length) return;

        html += `<blockquote>${markdown(quote.join("\n"))}</blockquote>`;
        quote = [];
      };

      const flushBlocks = () => {
        flushParagraph();
        flushList();
        flushQuote();
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // fenced code
        if (fence) {
          if (/^```/.test(line)) {
            const languageClass = fence.language
              ? ` class="language-${escapeAttribute(fence.language)}"`
              : "";

            html += `<pre><code${languageClass}>${escapeHtml(fence.lines.join("\n"))}</code></pre>`;
            fence = null;
          } else {
            fence.lines.push(line);
          }
          continue;
        }

        const fenceStart = line.match(/^```(.*)$/);
        if (fenceStart) {
          flushBlocks();
          fence = {
            language: fenceStart[1].trim(),
            lines: []
          };
          continue;
        }

        // table: header line + separator line
        if (
          line.includes("|") &&
          i + 1 < lines.length &&
          isTableSeparator(lines[i + 1])
        ) {
          flushBlocks();

          const headers = splitTableRow(line);
          const alignments = parseTableAlignments(lines[i + 1]);

          i += 2;

          const rows = [];
          while (
            i < lines.length &&
            lines[i].trim() &&
            lines[i].includes("|")
          ) {
            rows.push(splitTableRow(lines[i]));
            i++;
          }

          i--;

          html += "<table><thead><tr>";

          headers.forEach((cell, column) => {
            const align = alignments[column];
            const style = align ? ` style="text-align:${align}"` : "";
            html += `<th${style}>${inline(cell)}</th>`;
          });

          html += "</tr></thead><tbody>";

          rows.forEach(row => {
            html += "<tr>";

            headers.forEach((_, column) => {
              const align = alignments[column];
              const style = align ? ` style="text-align:${align}"` : "";
              html += `<td${style}>${inline(row[column] ?? "")}</td>`;
            });

            html += "</tr>";
          });

          html += "</tbody></table>";
          continue;
        }

        // blank line
        if (!line.trim()) {
          flushBlocks();
          continue;
        }

        // heading
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          flushBlocks();

          const level = heading[1].length;
          const title = heading[2].trim();
          const id = uniqueSlug(title);

          if (level <= 3) {
            toc.push({ level, title, id });
          }

          html += `<h${level} id="${id}">${inline(title)}</h${level}>`;
          continue;
        }

        // horizontal rule
        if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
          flushBlocks();
          html += "<hr>";
          continue;
        }

        // blockquote
        const quoted = line.match(/^>\s?(.*)$/);
        if (quoted) {
          flushParagraph();
          flushList();
          quote.push(quoted[1]);
          continue;
        }

        // Lists use two source spaces per nesting level.
        const unordered = line.match(/^([ \t]*)[-+*]\s+(.+)$/);
        if (unordered) {
          flushParagraph();
          flushQuote();

          const indentation = unordered[1].replaceAll("\t", "  ").length;
          list.push({
            type: "ul",
            depth: Math.floor(indentation / 2),
            text: unordered[2]
          });
          continue;
        }

        // ordered list
        const ordered = line.match(/^([ \t]*)\d+[.)]\s+(.+)$/);
        if (ordered) {
          flushParagraph();
          flushQuote();

          const indentation = ordered[1].replaceAll("\t", "  ").length;
          list.push({
            type: "ol",
            depth: Math.floor(indentation / 2),
            text: ordered[2]
          });
          continue;
        }

        // ordinary prose
        flushList();
        flushQuote();
        paragraph.push(line.trim());
      }

      if (fence) {
        html += `<pre><code>${escapeHtml(fence.lines.join("\n"))}</code></pre>`;
      }

      flushBlocks();
      return html;
    }


    function inline(text) {
      const code = [];
      const escapedBackticks = [];

      // Protect backslash-escaped backticks so they cannot open a code span.
      text = text.replace(/\\`/g, () => {
        const marker = `\u0000BACKTICK${escapedBackticks.length}\u0000`;
        escapedBackticks.push("`");
        return marker;
      });

      text = escapeHtml(text);

      // A run of N backticks closes only with another run of N backticks.
      // This allows: ``code containing a ` backtick``
      text = text.replace(/(`+)([\s\S]*?)\1/g, (_, delimiter, value) => {
        value = value.replace(/\s+/g, " ");

        // Match Markdown's optional padding around code-span content.
        if (value.startsWith(" ") && value.endsWith(" ") && /[^ ]/.test(value)) {
          value = value.slice(1, -1);
        }

        const marker = `\u0000CODE${code.length}\u0000`;
        code.push(`<code>${value}</code>`);
        return marker;
      });

      // images
      text = text.replace(
        /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"&quot;([^"]*)&quot;")?\)/g,
        (_, alt, src, title) =>
          `<img src="${src}" alt="${alt}"${title ? ` title="${title}"` : ""}>`
      );

      // links
      text = text.replace(
        /\[([^\]]+)\]\(([^)\s]+)(?:\s+"&quot;([^"]*)&quot;")?\)/g,
        (_, label, href, title) =>
          `<a href="${href}"${title ? ` title="${title}"` : ""}>${label}</a>`
      );

      // strong / emphasis
      text = text
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/__(.+?)__/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/_(.+?)_/g, "<em>$1</em>");

      // restore inline code
      text = text.replace(
        /\u0000CODE(\d+)\u0000/g,
        (_, index) => code[Number(index)]
      );

      // Restore literal backticks after all other inline formatting.
      text = text.replace(
        /\u0000BACKTICK(\d+)\u0000/g,
        (_, index) => escapedBackticks[Number(index)]
      );

      return text.replace(/\n/g, " ");
    }


    function splitTableRow(line) {
      return line
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map(cell => cell.trim());
    }


    function isTableSeparator(line) {
      const cells = splitTableRow(line);

      return (
        cells.length > 0 &&
        cells.every(cell => /^:?-{3,}:?$/.test(cell))
      );
    }


    function parseTableAlignments(line) {
      return splitTableRow(line).map(cell => {
        const left = cell.startsWith(":");
        const right = cell.endsWith(":");

        if (left && right) return "center";
        if (right) return "right";
        if (left) return "left";
        return "";
      });
    }


    function uniqueSlug(text) {
      const base =
        text
          .toLowerCase()
          .replace(/`([^`]+)`/g, "$1")
          .replace(/[*_~]/g, "")
          .replace(/&[a-z]+;/gi, "")
          .replace(/[^\p{L}\p{N}\s-]/gu, "")
          .trim()
          .replace(/\s+/g, "-") || "section";

      const count = slugCounts.get(base) ?? 0;
      slugCounts.set(base, count + 1);

      return count ? `${base}-${count + 1}` : base;
    }


    function renderToc(items) {
      const roots = [];
      const stack = [];

      items.forEach(item => {
        const node = { ...item, children: [] };

        while (stack.length && stack.at(-1).level >= node.level) {
          stack.pop();
        }

        const parent = stack.at(-1);
        (parent ? parent.children : roots).push(node);
        stack.push(node);
      });

      const rootLevel = Math.min(...items.map(item => item.level));

      function renderNodes(nodes, groupName) {
        return nodes.map((node, index) => {
          const link =
            `<a class="toc-${node.level}" href="#${node.id}">${escapeHtml(node.title)}</a>`;
          const children = renderNodes(node.children, `${groupName}-${index}`);

          if (!node.children.length) return link;

          // Keep the document title visible; fold lower-level branches.
          if (node.level === rootLevel) return link + children;

          return (
            `<details name="${groupName}">` +
            `<summary>${link}</summary>` +
            children +
            `</details>`
          );
        }).join("");
      }

      return items.length ? renderNodes(roots, "toc-section") : "";
    }


    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }


    function escapeAttribute(text) {
      return text.replace(/[^\w-]/g, "");
    }
  </script>

</body>
